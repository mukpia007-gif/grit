<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>좋은 습관 만들기 (Grit)</title>
<meta name="description" content="해낸 날마다 도장을 찍어 좋은 습관을 만드는 앱">
<meta name="theme-color" content="#FFF8F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Pretendard-ExtraBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Base reset (safe areas for phones with notches / gesture bars) */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
@font-face { font-family: "Pretendard"; font-weight: 400; font-display: swap; src: url("fonts/Pretendard-Regular.subset.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 600; font-display: swap; src: url("fonts/Pretendard-SemiBold.subset.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("fonts/Pretendard-Bold.subset.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; font-display: swap; src: url("fonts/Pretendard-ExtraBold.subset.woff2") format("woff2"); }

/* Layout: mobile-first single column (375–430px), white cards on warm cream, bottom tab bar (홈/기록/통계), + button bottom-right */
:root {
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --ink: #3A2E2A;
  --sub: #7A6B63;          /* #8A7B73 darkened slightly so small text passes WCAG AA on cream and white */
  --sub-soft: #8A7B73;     /* decorative only */
  --line: #F2E8DE;
  --line-strong: #E6D8CB;
  --coral: #E8836B;        /* point color: fills, buttons (with dark text), rings */
  --coral-soft: #FDECE5;
  --coral-ink: #B9533B;    /* coral for text on light backgrounds (AA) */
  --green: #2F7A5A;        /* 완료 */
  --green-soft: #E4F2EA;
  --blue-ink: #3E68A8;
  --danger: #B3362A;
  --shadow: 0 2px 12px rgb(58 46 42 / .06), 0 1px 2px rgb(58 46 42 / .04);
  --backdrop: rgb(58 46 42 / .4);
  --radius: 16px;

  --i-vermilion: #B9533B;
  --i-indigo: #3E68A8;
  --i-pine: #2F7A5A;
  --i-ochre: #93680F;
  --i-plum: #8E4A7A;
  --i-sumi: #6E5448;

  --f-body: "Pretendard", -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-title: var(--f-body);

  --tabbar-h: 68px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom, 0px));
}

/* Header */
/* Title: centered. "좋은 습관 만들기" on one line at 36px (scales down on very narrow phones so it never wraps), "(Grit)" 32.4px below; line gap tightened to 0.8×. */
.head { position: relative; padding-block: 18px 12px; }
.title {
  margin: 0; font-family: var(--f-title); font-weight: 800; letter-spacing: -0.035em;
  font-size: min(36px, 9.5vw); line-height: 1.2; color: var(--ink);
}
.title { text-align: center; }
.title .l1 { padding-inline: 44px; white-space: nowrap; min-height: 44px; display: flex; align-items: center; justify-content: center; }
.title .l2 { margin-top: 3px; line-height: 1.1; }
.title .l1, .title .l2 { display: block; }
.title .grit { font-size: 32.4px; font-weight: 800; color: var(--coral-ink); letter-spacing: -0.02em; white-space: nowrap; }
.head .icon-btn { position: absolute; top: 18px; right: -8px; }
@media (max-width: 319px) { .title .grit { font-size: 28.8px; } .title .l1 { padding-inline: 40px; } }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; color: var(--sub); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--card); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }

.stack { display: grid; gap: 16px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }

/* Summary */
.sum-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; }
.sum-date { font-size: 17px; font-weight: 600; color: var(--sub); }
.pill { font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--coral-soft); color: var(--coral-ink); }
.link-btn { border: 0; background: none; color: var(--coral-ink); font-size: 16px; font-weight: 700; min-height: 44px; padding: 0 6px; cursor: pointer; }
.big { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 14px; }
.big .n { font-size: 32px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--green); }
.big .of { font-size: 19px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; }
.big .pct { margin-left: auto; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--green); border-radius: 5px; transition: width .3s ease; }
.note { margin: 12px 0 0; font-size: 16px; font-weight: 600; }
.t-green { color: var(--green); } .t-coral { color: var(--coral-ink); } .t-sub { color: var(--sub); }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 12px; }
.day {
  border: 1.5px solid transparent; background: transparent; border-radius: 14px; min-height: 72px;
  display: grid; justify-items: center; align-content: center; gap: 2px; cursor: pointer; padding: 0;
}
.day .wd { font-size: 14px; font-weight: 600; color: var(--sub); }
.day .wd.sun { color: var(--coral-ink); } .day .wd.sat { color: var(--blue-ink); }
.day .dn { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .mk { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.day .mk.part { background: var(--coral); }
.day .mk.full { background: var(--green); }
.day[aria-current="date"] { background: var(--coral-soft); border-color: var(--coral); }

/* Section heading */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 12px 4px -4px; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 700; }
.sec .cnt { font-size: 16px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Habit cards */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.habit { --hc: var(--i-pine); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 20px; min-height: 92px; }
.habit {
  border: 1px solid #EBDFD3; transition: border-color .2s, box-shadow .2s;
  box-shadow: 0 8px 16px -6px rgb(58 46 42 / .16), 0 2px 5px rgb(58 46 42 / .07), 0 1px 1px rgb(58 46 42 / .05);
}
.habit.done { border-color: #E2D5C8; border-color: color-mix(in srgb, var(--hc) 32%, #EBDFD3); }
.habit.rest { box-shadow: 0 5px 12px -6px rgb(58 46 42 / .12), 0 1px 3px rgb(58 46 42 / .05); background: rgb(255 255 255 / .55); border: 1px dashed #DCCBBC; min-height: 76px; }
.habit .info { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; display: grid; gap: 4px; min-height: 44px; }
.habit .name { font-weight: 700; font-size: 19px; line-height: 1.35; }
.habit .meta { font-size: 15px; color: var(--sub); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-weight: 500; }
.habit .meta .streak { color: var(--green); font-weight: 700; }
.habit .meta .ok { color: var(--green); font-weight: 700; }
.dots { display: flex; gap: 5px; margin-top: 2px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.dots i.d { background: var(--hc); border-color: var(--hc); }
.dots i.x { border-style: dotted; opacity: .6; }

/* The seal (도장): a raised 3D round button, no outline. Light from the top-left: highlight gradient + drop shadow + inner shading. */
.stamp {
  flex: none; width: 60px; height: 60px; position: relative; border-radius: 50%;
  border: 0; cursor: pointer; padding: 0;
  display: grid; place-items: center; color: var(--sub);
  background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #FFFBF6 34%, #EFE3D7 100%);
  box-shadow:
    0 8px 16px -2px rgb(58 46 42 / .2), 0 3px 5px rgb(58 46 42 / .14), 0 1px 1px rgb(58 46 42 / .1),
    inset 0 -5px 8px rgb(58 46 42 / .12), inset 0 3px 3px rgb(255 255 255 / 1);
  transition: transform .12s ease, box-shadow .12s ease;
}
.stamp:hover { transform: translateY(-1px); box-shadow: 0 11px 20px -2px rgb(58 46 42 / .22), 0 4px 6px rgb(58 46 42 / .14), 0 1px 1px rgb(58 46 42 / .1), inset 0 -5px 8px rgb(58 46 42 / .12), inset 0 3px 3px rgb(255 255 255 / 1); }
button.stamp:active { transform: translateY(2px); box-shadow: 0 2px 4px rgb(58 46 42 / .2), inset 0 -1px 3px rgb(58 46 42 / .08), inset 0 3px 6px rgb(58 46 42 / .14); }
.stamp { --s1: 21px; --s2: 16.2px; --s3: 12.6px; }
.stamp .seal { position: relative; font-weight: 400; font-size: var(--s1); line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
.stamp .seal[data-len="2"] { font-size: var(--s2); }
.stamp .seal[data-len="3"] { font-size: var(--s3); letter-spacing: -0.04em; }
.stamp.on {
  color: #FFFFFF;
  background: var(--hc);
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--hc) 78%, #FFFFFF) 0%, var(--hc) 52%, color-mix(in srgb, var(--hc) 78%, #000000) 100%);
  box-shadow:
    0 9px 18px -2px rgb(58 46 42 / .32), 0 3px 6px rgb(58 46 42 / .2), 0 1px 1px rgb(58 46 42 / .14),
    inset 0 -6px 9px rgb(0 0 0 / .28), inset 0 3px 4px rgb(255 255 255 / .45);
}
.stamp.on .seal { text-shadow: 0 1px 1px rgb(0 0 0 / .25); }
button.stamp.on:hover { box-shadow: 0 12px 22px -2px rgb(58 46 42 / .34), 0 4px 7px rgb(58 46 42 / .2), 0 1px 1px rgb(58 46 42 / .14), inset 0 -6px 9px rgb(0 0 0 / .28), inset 0 3px 4px rgb(255 255 255 / .45); }
button.stamp.on:active { box-shadow: 0 2px 4px rgb(58 46 42 / .26), inset 0 -1px 3px rgb(0 0 0 / .15), inset 0 4px 7px rgb(0 0 0 / .26); }
.stamp.just { animation: press .32s cubic-bezier(.2, .8, .3, 1); }
@keyframes press {
  0% { transform: scale(.86); }
  55% { transform: scale(1.07); }
  100% { transform: scale(1); }
}
.habit.rest .stamp { width: 52px; height: 52px; --s1: 18px; --s2: 13.8px; --s3: 11.4px; }

/* Empty */
.empty { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 28px 20px 20px; }
.empty .ring { width: 84px; height: 84px; border-radius: 50%; border: 2px dashed var(--line-strong); display: grid; place-items: center; font-weight: 800; font-size: 30px; color: var(--sub-soft); transform: rotate(-6deg); }
.empty h2 { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--sub); max-width: 30ch; font-size: 16px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chips.left { justify-content: flex-start; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border: 1.5px solid var(--line-strong); background: var(--card); border-radius: 22px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.chip:hover { border-color: var(--coral); }
.chip small { font-size: 14px; color: var(--sub); font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--hc, var(--coral)); box-shadow: inset 0 0 0 1px var(--hc, var(--coral)); background: var(--coral-soft); }
.chip:disabled { opacity: .55; cursor: default; }
.chip:disabled:hover { border-color: var(--line-strong); }
.cdot { width: 12px; height: 12px; border-radius: 50%; background: var(--hc, var(--coral)); flex: none; border: 0; padding: 0; }
.cdot.big { width: 44px; height: 44px; cursor: pointer; background: transparent; position: relative; }
.cdot.big::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--hc); }

/* Buttons */
.actions { display: flex; gap: 10px; }
.btn { flex: 1; min-height: 52px; border-radius: 14px; padding: 0 18px; font-size: 17px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line-strong); background: var(--card); }
.btn.primary { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.btn.primary:hover { background: #E37660; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
.btn.quiet { color: var(--danger); }
.mini { min-height: 44px; min-width: 52px; border: 1.5px solid var(--line-strong); background: var(--card); border-radius: 12px; padding: 0 12px; font-size: 15px; font-weight: 700; cursor: pointer; flex: none; }
.mini.primary { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.mini.warn { color: var(--danger); }

/* History calendar */
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mhead h2 { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.msum { text-align: center; color: var(--sub); font-size: 16px; margin: 2px 0 14px; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wh { text-align: center; font-size: 14px; font-weight: 600; color: var(--sub); padding-bottom: 6px; }
.cal .wh.sun { color: var(--coral-ink); } .cal .wh.sat { color: var(--blue-ink); }
.hcell {
  min-height: 48px; border: 2px solid transparent; background: transparent; border-radius: 12px; padding: 0;
  display: grid; place-items: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; position: relative;
}
.hcell.full { background: var(--green-soft); color: var(--green); font-weight: 800; }
.hcell.part { background: var(--coral-soft); color: var(--coral-ink); }
.hcell.idle { color: var(--sub); }
.hcell:disabled { color: var(--line-strong); cursor: default; }
.hcell.today::after { content: ""; position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.hcell[aria-current="date"] { border-color: var(--ink); }
.legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--sub); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 2px; align-content: start; }
.tile .k { font-size: 15px; font-weight: 600; color: var(--sub); }
.tile .v { font-size: 32px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 17px; font-weight: 600; color: var(--sub); margin-left: 3px; }
.tile .s { font-size: 14px; color: var(--sub); font-weight: 500; }
.card h2.ct { margin: 0; font-size: 19px; font-weight: 700; }
.card .cs { margin: 2px 0 16px; color: var(--sub); font-size: 15px; }
.chart { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; }
.yaxis { position: relative; height: 150px; }
.yaxis span { position: absolute; right: 0; transform: translateY(50%); font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.plot { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 5px; }
.plot .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-strong); }
.plot .col { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; position: relative; z-index: 1; }
.plot .b { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--green); min-height: 3px; }
.plot .b.part { background: var(--coral); }
.plot .b.zero { background: var(--line-strong); }
.xaxis { grid-column: 2; display: flex; gap: 5px; margin-top: 6px; }
.xaxis span { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.xaxis span.today { color: var(--ink); font-weight: 800; }
.hstat { list-style: none; margin: 0; padding: 0; display: grid; }
.hstat li + li { border-top: 1px solid var(--line); }
.hstat button { width: 100%; text-align: left; background: none; border: 0; padding: 14px 0; display: grid; gap: 8px; cursor: pointer; min-height: 44px; }
.hstat .r1 { display: flex; align-items: center; gap: 10px; }
.hstat .r1 .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; }
.hstat .r1 .st { font-size: 15px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; flex: none; }
.hstat .r2 { display: flex; align-items: center; gap: 10px; }
.hstat .track { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hstat .track span { display: block; height: 100%; background: var(--hc); border-radius: 4px; }
.hstat .r2 .pv { font-size: 15px; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; min-width: 8.5em; text-align: right; }

/* Tab bar + add button */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -2px 12px rgb(58 46 42 / .05);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--sub); font-size: 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--coral-ink); }
.fab {
  position: fixed; z-index: 9;
  right: max(max(20px, env(safe-area-inset-right, 0px)), calc(50vw - 240px + 20px));
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--coral); color: var(--ink);
  box-shadow: 0 6px 18px rgb(232 131 107 / .45), 0 2px 4px rgb(58 46 42 / .12);
  display: grid; place-items: center;
}
.fab:hover { background: #E37660; }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border-radius: 24px 24px 0 0;
  padding: 10px max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 14px; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; min-width: 0; text-wrap: balance; line-height: 1.3; }
.sheet-head .hs { font-size: 15px; color: var(--sub); font-weight: 500; }
.sheet-head .stamp { width: 56px; height: 56px; cursor: default; --s1: 19.2px; --s2: 15px; --s3: 12px; }
.sheet-head .stamp:hover { transform: none; }
.lbl-note { font-weight: 500; font-size: 14px; margin-left: 4px; }
.short-row { display: flex; align-items: center; gap: 12px; }
.short-input { flex: none; width: 96px; text-align: center; font-weight: 400; letter-spacing: 0; }
.short-help { font-size: 14px; color: var(--sub); line-height: 1.45; min-width: 0; }
.mini-lbl { font-size: 14px; font-weight: 700; color: var(--sub); }
.pseal { width: 48px; height: 48px; cursor: pointer; --s1: 16.8px; --s2: 13.2px; --s3: 10.8px; flex: none; }
.pshort { display: block; font-size: 14px; font-weight: 500; color: var(--sub); }
.prow.editing { align-items: flex-start; padding-block: 12px; }
.pedit-fields { flex: 1; min-width: 0; display: grid; gap: 6px; }
.pedit-fields .text-input { min-height: 48px; }
.pedit-fields .short-input { width: 96px; }
.field { display: grid; gap: 10px; margin-bottom: 22px; }
.lbl, .field > label { font-size: 15px; font-weight: 700; color: var(--sub); }
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.text-input { width: 100%; font: inherit; font-size: 18px; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--bg); color: var(--ink); }
.text-input:focus { border-color: var(--coral); outline: none; box-shadow: 0 0 0 3px var(--coral-soft); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; position: relative; padding: 0; }
.swatch::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--sw); transition: box-shadow .15s; }
.swatch[aria-checked="true"]::after { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--sw); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dbtn { min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--card); font-size: 16px; font-weight: 700; cursor: pointer; padding: 0; }
.dbtn[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 15px; font-weight: 600; margin: -10px 0 12px; min-height: 1.2em; }
.dstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
.dstat { background: var(--bg); border-radius: 14px; padding: 12px 16px; display: grid; }
.dstat .k { font-size: 14px; font-weight: 600; color: var(--sub); }
.dstat .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
.dstat .v small { font-size: 15px; color: var(--sub); font-weight: 600; margin-left: 2px; }
.cell { min-height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; aspect-ratio: 1; max-width: 100%; }
.cell:disabled { cursor: default; color: var(--line-strong); }
.cell.off { color: var(--sub-soft); font-weight: 400; }
.cell.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cell.done { color: #FFFFFF; background: var(--hc); font-weight: 800; transform: rotate(var(--rot, -6deg)); }
.hint { margin: 10px 0 18px; font-size: 15px; color: var(--sub); }
/* Monthly record list in the habit detail sheet */
.mrec { margin: 4px 0 22px; }
.mrec h3 { margin: 0 0 2px; font-size: 18px; font-weight: 700; }
.mrec .cs { margin: 0 0 10px; font-size: 14px; color: var(--sub); }
.mlist { list-style: none; margin: 0; padding: 0; border: 1px solid #EBDFD3; border-radius: 14px; overflow: hidden; }
.mlist li + li { border-top: 1px solid var(--line); }
.mrow {
  width: 100%; min-height: 52px; border: 0; background: var(--card); cursor: pointer; text-align: left;
  display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto 3.4em; align-items: center; gap: 10px; padding: 8px 14px;
  font-variant-numeric: tabular-nums;
}
.mrow[aria-current="true"] { background: var(--coral-soft); }
.mrow .mn { font-size: 16px; font-weight: 700; white-space: nowrap; }
.mrow .mn small { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-top: 1px; }
.mrow .mt { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mrow .mt span { display: block; height: 100%; border-radius: 4px; background: var(--hc); }
.mrow .mc { font-size: 15px; color: var(--sub); font-weight: 600; white-space: nowrap; }
.mrow .mp { font-size: 16px; font-weight: 800; text-align: right; }
.confirm { background: var(--coral-soft); border-radius: 14px; padding: 16px; display: grid; gap: 12px; margin-top: 10px; }
.confirm p { margin: 0; font-size: 16px; }
.info-block { background: var(--bg); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; display: grid; gap: 8px; }
.info-block h3 { margin: 0; font-size: 17px; font-weight: 700; }
.info-block p, .info-block ol { margin: 0; color: var(--sub); font-size: 16px; }
.info-block ol { padding-left: 1.3em; display: grid; gap: 6px; }
.info-block b { color: var(--ink); }
.status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sub-soft); margin-right: 7px; vertical-align: 2px; }
.status-dot.cloud { background: var(--green); }
.status-dot.local { background: var(--coral); }
.plist { list-style: none; margin: 0 0 16px; padding: 0; display: grid; }
.prow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 64px; }
.prow .pname { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; }
.pedit { display: flex; align-items: flex-start; gap: 12px; flex: 1; min-width: 0; }
.pedit .text-input { min-width: 0; font-size: 17px; }
.padd { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: end; }
.padd > div { display: grid; gap: 6px; min-width: 0; }
.padd .short-input { width: 100%; }
.padd .btn { flex: none; min-height: 52px; }
@media (max-width: 359px) { .padd { grid-template-columns: minmax(0, 1fr) 84px; } .padd .btn { grid-column: 1 / -1; } }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: #FFFFFF; padding: 12px 18px; border-radius: 14px;
  font-size: 16px; font-weight: 600; max-width: calc(100% - 40px); box-shadow: var(--shadow); text-align: center;
}

@media (max-width: 359px) {
  .week { padding: 8px; gap: 2px; }
  .tile .v { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .stamp.just, .sheet { animation: none; }
  .bar > span { transition: none; }
}
/* Install / backup notice card on the home tab */
.notice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #EBDFD3; }
.notice .nt { flex: 1; min-width: 0; font-size: 15px; line-height: 1.45; }
.notice .nt b { display: block; font-size: 16px; color: var(--ink); }
.notice .nt span { color: var(--sub); }
.notice .btn { flex: none; min-height: 44px; padding: 0 14px; font-size: 15px; }
.notice .x { flex: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <h1 class="title"><span class="l1">좋은 습관 만들기</span><span class="l2"><span class="grit">(Grit)</span></span></h1>
    <button class="icon-btn" data-act="settings" aria-label="설정과 도움말">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main" class="stack"></main>
</div>

<button class="fab" data-act="add" aria-label="습관 추가">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="화면 전환">
  <div class="in" id="tabs">
    <button class="tab" data-act="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈
    </button>
    <button class="tab" data-act="tab" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></svg>기록
    </button>
    <button class="tab" data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>통계
    </button>
  </div>
</nav>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
(() => {
  /* ---------- Dates & format ---------- */
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const MON_FIRST = [1, 2, 3, 4, 5, 6, 0];
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = s => parse(s).getDay();
  const todayStr = () => ymd(new Date());
  const longDate = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
  const fmt = n => Number(n).toLocaleString('ko-KR');

  const COLORS = [
    ['vermilion', '코랄'], ['indigo', '파랑'], ['pine', '초록'],
    ['ochre', '호박'], ['plum', '자두'], ['sumi', '갈색']
  ];
  const PRESET_ID = '_presets';
  const DEFAULT_PRESETS = [
    { name: '성경 1장', color: 'plum', short: '성경' }, { name: '특허법 1과', color: 'indigo', short: '특허' },
    { name: '10분 걷기', color: 'pine', short: '걷기' }, { name: '10분 독서', color: 'ochre', short: '독서' },
    { name: '영양제 챙기기', color: 'vermilion', short: '영양' }, { name: '하루에 물 10잔', color: 'sumi', short: '물' },
    { name: '근력운동 10분', color: 'vermilion', short: '근력' }
  ];
  // List versions: 2 = 물 5잔 → 10잔 + 근력운동 10분, 3 = 압축표현(도장 글자) 지정. Each applied once to data saved earlier.
  const PRESET_V = 3, WATER_V = 2;
  const OLD_WATER = '하루에 물 5잔', NEW_WATER = '하루에 물 10잔', NEW_ITEM = '근력운동 10분';
  const SHORT_MAP = Object.fromEntries(DEFAULT_PRESETS.map(p => [p.name, p.short]));
  const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
  const SHORT_MAX = 3;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 압축표현: 도장 안에 들어가는 1~3글자
  const cleanShort = s => Array.from(String(s || '').replace(/\s+/g, '')).slice(0, SHORT_MAX).join('');
  const autoShort = name => Array.from(String(name || '').replace(/\s+/g, '')).slice(0, 2).join('') || '·';
  const sealText = h => h.short || autoShort(h.name);
  // Seal content: 1~3 letters (압축표현)
  const sealSpan = (text, id) => `<span class="seal" data-len="${Math.min(Array.from(text).length, 3)}"${id ? ` id="${id}"` : ''}>${esc(text)}</span>`;
  const inkVar = c => `var(--i-${COLORS.some(x => x[0] === c) ? c : 'pine'})`;
  const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
  const rotFor = key => `${(hash(key) % 13) - 8}deg`;
  const clone = o => JSON.parse(JSON.stringify(o));
  const ICON_X = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ICON_L = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  const ICON_R = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

  /* ---------- Habit logic ---------- */
  const scheduled = (h, s) => h.days.includes(dow(s));
  const startOf = h => { let s = h.createdAt; for (const d of h.done) if (d < s) s = d; return s; };
  const doneCache = new WeakMap();
  const doneSet = h => { let s = doneCache.get(h.done); if (!s) { s = new Set(h.done); doneCache.set(h.done, s); } return s; };
  const isDone = (h, s) => doneSet(h).has(s);
  const activeOn = (h, s) => s >= startOf(h) && scheduled(h, s);
  const schedLabel = days => {
    const set = new Set(days);
    if (set.size === 7) return '매일';
    if (set.size === 5 && [1, 2, 3, 4, 5].every(d => set.has(d))) return '평일';
    if (set.size === 2 && set.has(0) && set.has(6)) return '주말';
    return MON_FIRST.filter(d => set.has(d)).map(d => WD[d]).join('·');
  };
  function currentStreak(h) {
    const today = todayStr(), start = startOf(h);
    let s = today, c = 0, guard = 0;
    while (s >= start && guard++ < 4000) {
      if (isDone(h, s)) c++;
      else if (s !== today && scheduled(h, s)) break;
      s = addDays(s, -1);
    }
    return c;
  }
  function bestStreak(h) {
    const today = todayStr();
    let s = startOf(h), run = 0, best = 0, guard = 0;
    while (s <= today && guard++ < 4000) {
      if (isDone(h, s)) { run++; if (run > best) best = run; }
      else if (s !== today && scheduled(h, s)) run = 0;
      s = addDays(s, 1);
    }
    return best;
  }
  // Completion rate over [from, to] for the given habits; today counts only once done.
  function rateOver(list, from, to) {
    const today = todayStr();
    if (to > today) to = today;
    let total = 0, hit = 0;
    for (let s = from; s <= to; s = addDays(s, 1)) {
      for (const h of list) {
        if (!activeOn(h, s)) continue;
        const d = isDone(h, s);
        if (s === today && !d) continue;
        total++; if (d) hit++;
      }
    }
    return total ? Math.round(hit / total * 100) : null;
  }
  function dayStat(s) {
    let total = 0, done = 0;
    for (const h of habits) if (activeOn(h, s)) { total++; if (isDone(h, s)) done++; }
    return { total, done };
  }
  const normalize = h => ({
    id: String(h.id),
    name: String(h.name || '이름 없는 습관').slice(0, 40),
    color: COLORS.some(c => c[0] === h.color) ? h.color : 'pine',
    days: Array.isArray(h.days) && h.days.length ? h.days.filter(d => d >= 0 && d <= 6) : [0, 1, 2, 3, 4, 5, 6],
    createdAt: typeof h.createdAt === 'string' ? h.createdAt : todayStr(),
    order: Number(h.order) || 0,
    done: Array.isArray(h.done) ? [...new Set(h.done.filter(d => typeof d === 'string'))].sort() : [],
    mig: Number(h.mig) || 0,
    short: cleanShort(h.short)
  });
  const sortH = list => list.sort((a, b) => a.order - b.order || (a.createdAt < b.createdAt ? -1 : 1));

  /* ---------- Storage: this phone only ----------
     Every family member installs the app on their own phone, and each phone keeps its own records
     in the browser's storage, so nobody's habits or stamps mix with anyone else's. */
  const LS_DATA = 'grit.habits', LS_PRESETS = 'grit.presets', LS_BACKUP = 'grit.lastBackup', LS_NOTICE = 'grit.noticeHidden.';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

  const normPresets = list => {
    const seen = new Set(), out = [];
    for (const p of Array.isArray(list) ? list : []) {
      const name = String(p && p.name || '').trim().slice(0, 24);
      if (!name || seen.has(name)) continue;
      seen.add(name);
      out.push({ name, color: COLORS.some(c => c[0] === p.color) ? p.color : 'pine', short: cleanShort(p.short) });
    }
    return out;
  };

  let habits = [];
  try { habits = sortH((JSON.parse(lsGet(LS_DATA) || '[]') || []).map(normalize)); } catch (e) { habits = []; }
  let presets = null;
  try { const raw = lsGet(LS_PRESETS); presets = raw ? normPresets(JSON.parse(raw)) : null; } catch (e) { presets = null; }
  if (!presets) presets = clone(DEFAULT_PRESETS);

  const mode = 'local';
  let saveFailed = false, persistAsked = false;
  function saveCache() {
    const ok = lsSet(LS_DATA, JSON.stringify(habits)) && lsSet(LS_PRESETS, JSON.stringify(presets));
    if (!ok && !saveFailed) toast('저장하지 못했어요. 폰의 저장 공간을 확인해 주세요.');
    saveFailed = !ok;
  }
  // Save after every change. The first save also asks the browser to keep this data when space runs low.
  function sync() {
    saveCache();
    if (!persistAsked) {
      persistAsked = true;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
    }
  }

  /* ---------- Backup & restore (a JSON file the person keeps) ---------- */
  const backupName = () => `grit-backup-${todayStr()}.json`;
  const backupBlob = () => new Blob([JSON.stringify({ app: 'grit', version: 1, exportedAt: new Date().toISOString(), habits, presets }, null, 1)], { type: 'application/json' });
  const canShareFile = () => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; }
  };
  function markBackedUp() { lsSet(LS_BACKUP, todayStr()); }
  function saveBackupFile() {
    const url = URL.createObjectURL(backupBlob());
    const a = document.createElement('a');
    a.href = url; a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markBackedUp();
    toast('백업 파일을 폰의 ‘다운로드’ 폴더에 저장했어요');
    render();
  }
  async function shareBackupFile() {
    const file = new File([backupBlob()], backupName(), { type: 'application/json' });
    try {
      await navigator.share({ files: [file], title: 'Grit 백업' });
      markBackedUp(); toast('백업 파일을 보냈어요'); render();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      saveBackupFile();
    }
  }
  function readBackup(text) {
    let d; try { d = JSON.parse(text); } catch (e) { return null; }
    if (!d || d.app !== 'grit' || !Array.isArray(d.habits)) return null;
    const hs = d.habits.filter(h => h && h.id).map(normalize);
    const ps = Array.isArray(d.presets) ? normPresets(d.presets) : null;
    return { habits: hs, presets: ps, exportedAt: String(d.exportedAt || '').slice(0, 10) };
  }
  const daysSince = s => s ? Math.round((parse(todayStr()) - parse(s)) / 86400000) : Infinity;
  const noticeHidden = kind => daysSince(lsGet(LS_NOTICE + kind)) < 7;

  /* ---------- UI state ---------- */
  let tab = 'home';
  let selDate = todayStr();
  let lastToday = selDate;
  let histDate = selDate, histMonth = selDate.slice(0, 7);
  let justKey = null;
  let sheet = null;

  const $ = id => document.getElementById(id);

  function toggle(id, date) {
    const h = habits.find(x => x.id === id);
    if (!h || date > todayStr()) return;
    const set = new Set(h.done);
    if (set.has(date)) set.delete(date);
    else { set.add(date); justKey = id + '|' + date; try { navigator.vibrate && navigator.vibrate(12); } catch (e) { } }
    h.done = [...set].sort();
    sync(id);
    render();
  }
  function createHabit(name, color, days, short) {
    const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const order = habits.reduce((m, h) => Math.max(m, h.order), 0) + 1;
    const h = normalize({ id, name: name.trim(), color, days, createdAt: todayStr(), order, done: [], mig: WATER_V, short: cleanShort(short) || autoShort(name) });
    habits.push(h);
    sync(id);
    return h;
  }

  /* ---------- Render ---------- */
  function render() {
    document.querySelectorAll('#tabs .tab').forEach(b => {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const main = $('main');
    const f = document.activeElement && document.activeElement.closest && document.activeElement.closest('#main [data-act]');
    const fSel = f ? `[data-act="${f.dataset.act}"]` + (f.dataset.id ? `[data-id="${f.dataset.id}"]` : '') + (f.dataset.date ? `[data-date="${f.dataset.date}"]` : '') : null;

    main.innerHTML = tab === 'home' ? homeHTML() : tab === 'history' ? historyHTML() : statsHTML();

    if (fSel) { const el = main.querySelector(fSel); if (el) el.focus({ preventScroll: true }); }
    if (sheet && sheet.type === 'detail') renderDetail();
    if (sheet && sheet.type === 'settings') renderSettings();
    justKey = null;
  }

  function habitRow(h, date, rest) {
    const on = isDone(h, date);
    const key = h.id + '|' + date;
    const streak = currentStreak(h);
    let dots = '';
    for (let i = 6; i >= 0; i--) {
      const s = addDays(date, -i);
      dots += `<i class="${isDone(h, s) ? 'd' : scheduled(h, s) ? '' : 'x'}"></i>`;
    }
    return `<li class="habit ${rest ? 'rest' : ''} ${on ? 'done' : ''}" style="--hc:${inkVar(h.color)}">
      <button class="info" data-act="open" data-id="${h.id}">
        <span class="name">${esc(h.name)}</span>
        <span class="meta">${on ? '<span class="ok">완료</span><span aria-hidden="true">·</span>' : ''}${streak ? `<span class="streak num">연속 ${fmt(streak)}일</span><span aria-hidden="true">·</span>` : ''}<span>${schedLabel(h.days)}</span></span>
        <span class="dots" aria-hidden="true">${dots}</span>
      </button>
      <button class="stamp ${on ? 'on' : ''} ${justKey === key ? 'just' : ''}" style="--rot:${rotFor(key)}"
        data-act="toggle" data-id="${h.id}" data-date="${date}" aria-pressed="${on}" aria-label="${esc(h.name)} ${on ? '도장 취소' : '도장 찍기'}">
        ${sealSpan(sealText(h))}
      </button>
    </li>`;
  }
  function habitLists(date) {
    const sched = habits.filter(h => scheduled(h, date));
    const rest = habits.filter(h => !scheduled(h, date));
    const label = date === todayStr() ? '오늘 할 일' : '이날 할 일';
    const dn = sched.filter(h => isDone(h, date)).length;
    let html = '';
    if (sched.length) html += `<div class="sec"><h2>${label}</h2><span class="cnt">${dn} / ${sched.length}</span></div><ul class="list">${sched.map(h => habitRow(h, date, false)).join('')}</ul>`;
    if (rest.length) html += `<div class="sec"><h2>쉬는 날</h2><span class="cnt">${rest.length}개</span></div><ul class="list">${rest.map(h => habitRow(h, date, true)).join('')}</ul>`;
    return html;
  }

  function emptyHTML() {
    return `<section class="card empty">
      <div class="ring" aria-hidden="true">日</div>
      <h2>첫 습관을 정해 보세요</h2>
      <p>내 습관 목록에서 골라 바로 시작하세요. 고른 습관은 매일 하는 습관이 돼요.</p>
      <div class="chips">${presets.map((p, i) => `<button class="chip" data-act="suggest" data-i="${i}" style="--hc:${inkVar(p.color)}"><span class="cdot"></span>${esc(p.name)}</button>`).join('')}</div>
      ${presets.length ? `<div class="actions" style="width:100%;max-width:340px"><button class="btn primary" data-act="add-all">목록 ${presets.length}개 모두 시작</button></div>` : ''}
      <button class="link-btn" data-act="presets">목록 편집</button>
    </section>`;
  }

  // One small card at the top of 홈: install the app first; later, a reminder to back up.
  function noticeHTML() {
    const xBtn = kind => `<button class="icon-btn x" data-act="notice-hide" data-kind="${kind}" aria-label="안내 닫기">${ICON_X}</button>`;
    if (installPrompt && !isStandalone() && !noticeHidden('install')) {
      return `<section class="card notice"><div class="nt"><b>홈 화면에 앱으로 설치하세요</b><span>주소창 없이 열리고 인터넷이 없어도 써요.</span></div>
        <button class="btn primary" data-act="install">설치</button>${xBtn('install')}</section>`;
    }
    const total = habits.reduce((n, h) => n + h.done.length, 0);
    if (total >= 20 && daysSince(lsGet(LS_BACKUP)) > 30 && !noticeHidden('backup')) {
      return `<section class="card notice"><div class="nt"><b>${lsGet(LS_BACKUP) ? '한 달 넘게 백업하지 않았어요' : '기록을 백업해 두세요'}</b><span>폰을 바꾸면 기록이 옮겨지지 않아요.</span></div>
        <button class="btn primary" data-act="settings">백업</button>${xBtn('backup')}</section>`;
    }
    return '';
  }

  function homeHTML() {
    if (!habits.length) return noticeHTML() + emptyHTML();
    const today = todayStr(), isToday = selDate === today;
    const sched = habits.filter(h => scheduled(h, selDate));
    const dn = sched.filter(h => isDone(h, selDate)).length;
    const pct = sched.length ? Math.round(dn / sched.length * 100) : 0;
    const left = sched.length - dn;
    const word = isToday ? '오늘' : '이날';

    let sum = `<section class="card">
      <div class="sum-top"><span class="sum-date">${longDate(selDate)}</span>
        ${isToday ? '' : `<span class="pill">지난 날 기록 중</span><button class="link-btn" data-act="go-today">오늘로</button>`}</div>`;
    if (sched.length) {
      sum += `<div class="big"><span class="n">${dn}</span><span class="of">/ ${sched.length} 완료</span><span class="pct ${pct === 100 ? 't-green' : ''}">${pct}%</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${sched.length}" aria-valuenow="${dn}" aria-label="${word} 달성"><span style="width:${pct}%"></span></div>
        <p class="note ${left ? 't-coral' : 't-green'}">${left ? `${left}개 남았어요` : `${word} 할 일을 모두 해냈어요`}</p>`;
    } else {
      sum += `<p class="note t-sub">${word}은 모두 쉬는 날이에요</p>`;
    }
    sum += `</section>`;

    let wk = '';
    for (let i = 6; i >= 0; i--) {
      const s = addDays(today, -i), w = dow(s);
      const st = dayStat(s);
      const mk = !st.total ? '' : st.done === st.total ? 'full' : st.done ? 'part' : '';
      wk += `<button class="day" data-act="pick-day" data-date="${s}" ${s === selDate ? 'aria-current="date"' : ''} aria-label="${longDate(s)}${st.total ? `, ${st.done}/${st.total} 완료` : ''}">
        <span class="wd ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${s === today ? '오늘' : WD[w]}</span>
        <span class="dn">${parse(s).getDate()}</span><span class="mk ${mk}"></span></button>`;
    }
    return noticeHTML() + sum + `<nav class="card week" aria-label="최근 7일">${wk}</nav>` + habitLists(selDate);
  }

  function noHabitsCard(text) {
    return `<section class="card empty"><div class="ring" aria-hidden="true">日</div><h2>아직 기록이 없어요</h2><p>${text}</p>
      <div class="actions" style="width:100%;max-width:300px"><button class="btn primary" data-act="add">습관 추가</button></div></section>`;
  }

  function historyHTML() {
    if (!habits.length) return noHabitsCard('습관을 만들고 도장을 찍으면 날짜별 기록이 여기에 쌓여요.');
    const today = todayStr(), thisMonth = today.slice(0, 7);
    const [y, m] = histMonth.split('-').map(Number);
    const first = new Date(y, m - 1, 1), dim = new Date(y, m, 0).getDate();
    const mStart = `${histMonth}-01`, mEnd = `${histMonth}-${pad(dim)}`;
    const stamps = habits.reduce((n, h) => n + h.done.filter(s => s.startsWith(histMonth)).length, 0);
    const rate = rateOver(habits, mStart, mEnd);

    let cells = WD.map((w, i) => `<div class="wh ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
    for (let d = 1; d <= dim; d++) {
      const s = `${histMonth}-${pad(d)}`;
      const st = dayStat(s);
      const future = s > today;
      const cls = future ? '' : !st.total ? 'idle' : st.done === st.total ? 'full' : st.done ? 'part' : '';
      cells += `<button class="hcell ${cls} ${s === today ? 'today' : ''}" data-act="hist-day" data-date="${s}" ${future ? 'disabled' : ''} ${s === histDate ? 'aria-current="date"' : ''}
        aria-label="${m}월 ${d}일${st.total && !future ? `, ${st.done}/${st.total} 완료` : ''}">${d}</button>`;
    }
    const hd = dayStat(histDate);
    return `<section class="card">
        <div class="mhead">
          <button class="icon-btn" data-act="hist-month" data-dir="-1" aria-label="이전 달">${ICON_L}</button>
          <h2>${y}년 ${m}월</h2>
          <button class="icon-btn" data-act="hist-month" data-dir="1" aria-label="다음 달" ${histMonth >= thisMonth ? 'disabled' : ''}>${ICON_R}</button>
        </div>
        <p class="msum">도장 <b class="num">${fmt(stamps)}</b>개 · 달성률 <b class="num">${rate === null ? '–' : rate + '%'}</b></p>
        <div class="cal">${cells}</div>
        <div class="legend"><span><i style="background:var(--green-soft);box-shadow:inset 0 0 0 1.5px var(--green)"></i>모두 완료</span><span><i style="background:var(--coral-soft);box-shadow:inset 0 0 0 1.5px var(--coral)"></i>일부 완료</span></div>
      </section>
      <section class="card" style="padding-block:16px">
        <div class="sum-top"><span class="sum-date" style="color:var(--ink)">${longDate(histDate)}</span></div>
        <p class="note ${hd.total && hd.done === hd.total ? 't-green' : 't-sub'}" style="margin-top:4px">${hd.total ? `${hd.done} / ${hd.total} 완료` : '이날 할 습관이 없어요'} · 동그라미를 눌러 도장을 찍거나 지워요</p>
      </section>` + habitLists(histDate);
  }

  function statsHTML() {
    if (!habits.length) return noHabitsCard('도장이 쌓이면 달성률과 연속 기록을 보여 드려요.');
    const today = todayStr();
    const monday = addDays(today, -((dow(today) + 6) % 7));
    const weekRate = rateOver(habits, monday, today);
    const monthRate = rateOver(habits, today.slice(0, 7) + '-01', today);
    const total = habits.reduce((n, h) => n + h.done.length, 0);
    let bestH = null, best = 0;
    for (const h of habits) { const b = bestStreak(h); if (b > best) { best = b; bestH = h; } }

    const tile = (k, v, unit, s, cls) => `<div class="tile"><span class="k">${k}</span><span class="v ${cls || ''}">${v}${unit ? `<small>${unit}</small>` : ''}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
    let html = `<div class="tiles">
      ${tile('이번 주 달성률', weekRate === null ? '–' : weekRate, weekRate === null ? '' : '%', '월요일부터 오늘까지', weekRate === 100 ? 't-green' : '')}
      ${tile('이번 달 달성률', monthRate === null ? '–' : monthRate, monthRate === null ? '' : '%', `${parse(today).getMonth() + 1}월 1일부터`, monthRate === 100 ? 't-green' : '')}
      ${tile('찍은 도장', fmt(total), '개', `습관 ${habits.length}개`)}
      ${tile('최고 연속', fmt(best), '일', bestH ? esc(bestH.name) : '아직 없어요', 't-green')}
    </div>`;

    // 14-day chart
    let cols = '', xs = '';
    for (let i = 13; i >= 0; i--) {
      const s = addDays(today, -i), st = dayStat(s);
      const r = st.total ? Math.round(st.done / st.total * 100) : null;
      const cls = r === null ? '' : r === 100 ? '' : r === 0 ? 'zero' : 'part';
      cols += `<div class="col" role="img" aria-label="${longDate(s)} ${r === null ? '할 습관 없음' : r + '%'}">${r === null ? '' : `<div class="b ${cls}" style="height:${r}%"></div>`}</div>`;
      xs += `<span class="${s === today ? 'today' : ''}">${parse(s).getDate()}</span>`;
    }
    html += `<section class="card">
      <h2 class="ct">최근 14일 달성률</h2>
      <p class="cs">초록은 모두 완료, 코랄은 일부 완료한 날이에요.</p>
      <div class="chart">
        <div class="yaxis" aria-hidden="true"><span style="bottom:100%">100%</span><span style="bottom:50%">50%</span><span style="bottom:0">0%</span></div>
        <div class="plot"><div class="gl" style="bottom:100%"></div><div class="gl" style="bottom:50%"></div><div class="gl" style="bottom:0"></div>${cols}</div>
        <div class="xaxis" aria-hidden="true">${xs}</div>
      </div>
    </section>`;

    html += `<section class="card">
      <h2 class="ct">습관별 기록</h2>
      <p class="cs">최근 30일 달성률이에요. 누르면 달력을 볼 수 있어요.</p>
      <ul class="hstat">${habits.map(h => {
        const r = rateOver([h], addDays(today, -29), today), cur = currentStreak(h), b = bestStreak(h);
        return `<li style="--hc:${inkVar(h.color)}"><button data-act="open" data-id="${h.id}">
          <span class="r1"><span class="cdot"></span><span class="nm">${esc(h.name)}</span><span class="st">연속 ${fmt(cur)}일</span></span>
          <span class="r2"><span class="track"><span style="width:${r || 0}%"></span></span><span class="pv">${r === null ? '–' : r + '%'} · 최고 ${fmt(b)}일</span></span>
        </button></li>`;
      }).join('')}</ul>
    </section>`;
    return html;
  }

  /* ---------- Sheets ---------- */
  function openSheet(s) {
    sheet = s;
    $('sheet-wrap').hidden = false;
    document.body.style.overflow = 'hidden';
    if (s.type === 'add' || s.type === 'edit') renderForm();
    else if (s.type === 'detail') renderDetail();
    else if (s.type === 'settings') renderSettings();
    else if (s.type === 'presets') renderPresets();
    $('sheet').scrollTop = 0;
  }
  function closeSheet() {
    sheet = null;
    $('sheet-wrap').hidden = true;
    document.body.style.overflow = '';
    $('sheet').innerHTML = '';
  }
  const closeBtn = `<button class="icon-btn" data-act="close" aria-label="닫기">${ICON_X}</button>`;

  function presetChips(d) {
    if (!presets.length) return `<span class="t-sub" style="font-size:15px">목록이 비어 있어요. ‘목록 편집’에서 이름을 추가하세요.</span>`;
    const used = new Set(habits.map(h => h.name));
    return presets.map((p, i) => {
      const has = used.has(p.name);
      return `<button type="button" class="chip" data-act="use-preset" data-i="${i}" style="--hc:${inkVar(p.color)}"
        aria-pressed="${d.name.trim() === p.name}" ${has ? 'disabled aria-label="' + esc(p.name) + ', 이미 있는 습관"' : ''}>
        <span class="cdot"></span>${esc(p.name)}${has ? ' <small>사용 중</small>' : ''}</button>`;
    }).join('');
  }

  function renderForm() {
    const d = sheet.draft;
    const editing = sheet.type === 'edit';
    $('sheet').setAttribute('aria-label', editing ? '습관 편집' : '새 습관');
    $('sheet').innerHTML = `<div class="grip"></div>
      <div class="sheet-head" style="--hc:${inkVar(d.color)}">
        <span class="stamp on" style="--rot:-7deg" aria-hidden="true" id="form-stamp">${sealSpan(d.short || autoShort(d.name || '새'), 'form-seal')}</span>
        <h2>${editing ? '습관 편집' : '새 습관'}</h2>${closeBtn}
      </div>
      <form id="habit-form" novalidate>
        ${editing ? '' : `<div class="field">
          <div class="lbl-row"><span class="lbl">내 목록에서 고르기</span><button type="button" class="link-btn" data-act="presets-from-add">목록 편집</button></div>
          <div class="chips left" id="form-presets">${presetChips(d)}</div>
        </div>`}
        <div class="field">
          <label for="habit-name">${editing ? '이름' : '또는 직접 입력'}</label>
          <input class="text-input" id="habit-name" maxlength="24" autocomplete="off" enterkeyhint="next" placeholder="예: 아침에 물 한 잔" value="${esc(d.name)}">
        </div>
        <div class="field">
          <label for="habit-short">압축표현 <span class="lbl-note">도장 안에 들어갈 1~3글자</span></label>
          <div class="short-row">
            <input class="text-input short-input" id="habit-short" maxlength="3" autocomplete="off" enterkeyhint="done" placeholder="예: 성경" value="${esc(d.short)}" aria-describedby="short-help">
            <span class="short-help" id="short-help">2글자가 가장 잘 보여요. 이름을 쓰면 앞 2글자가 먼저 채워져요.</span>
          </div>
        </div>
        <div class="field">
          <span class="lbl" id="color-lbl">도장 색</span>
          <div class="swatches" role="radiogroup" aria-labelledby="color-lbl">
            ${COLORS.map(([k, label]) => `<button type="button" class="swatch" role="radio" aria-checked="${d.color === k}" aria-label="${label}" data-act="pick-color" data-color="${k}" style="--sw:var(--i-${k})"></button>`).join('')}
          </div>
        </div>
        <div class="field">
          <span class="lbl">하는 요일</span>
          <div class="presets">
            <button type="button" class="chip" data-act="preset" data-p="all">매일</button>
            <button type="button" class="chip" data-act="preset" data-p="wk">평일</button>
            <button type="button" class="chip" data-act="preset" data-p="we">주말</button>
          </div>
          <div class="days">
            ${MON_FIRST.map(w => `<button type="button" class="dbtn" data-act="pick-day-of-week" data-w="${w}" aria-pressed="${d.days.includes(w)}" aria-label="${WD[w]}요일">${WD[w]}</button>`).join('')}
          </div>
        </div>
        <p class="err" id="form-err" role="alert"></p>
        <div class="actions"><button type="submit" class="btn primary">${editing ? '저장' : '습관 만들기'}</button></div>
      </form>`;
  }
  function refreshFormBits() {
    const d = sheet.draft;
    if ($('form-presets')) $('form-presets').querySelectorAll('.chip').forEach(b => {
      const p = presets[+b.dataset.i]; if (p) b.setAttribute('aria-pressed', String(d.name.trim() === p.name));
    });
    const st = d.short || autoShort(d.name || '새');
    $('form-seal').textContent = st;
    $('form-seal').dataset.len = Math.min(Array.from(st).length, 3);
    const si = $('habit-short'); if (si && si.value !== d.short) si.value = d.short;
    $('sheet').querySelector('.sheet-head').style.setProperty('--hc', inkVar(d.color));
    $('sheet').querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-checked', String(b.dataset.color === d.color)));
    $('sheet').querySelectorAll('.dbtn').forEach(b => b.setAttribute('aria-pressed', String(d.days.includes(+b.dataset.w))));
  }
  function submitForm() {
    const d = sheet.draft;
    const name = d.name.trim();
    if (!name) { $('form-err').textContent = '습관 이름을 입력하거나 목록에서 골라 주세요.'; $('habit-name').focus(); return; }
    const short = cleanShort(d.short);
    if (!short) { $('form-err').textContent = '압축표현을 1~3글자로 정해 주세요.'; $('habit-short').focus(); return; }
    if (!d.days.length) { $('form-err').textContent = '요일을 하나 이상 골라 주세요.'; return; }
    d.short = short;
    if (sheet.type === 'edit') {
      const h = habits.find(x => x.id === sheet.id);
      if (h) { h.name = name; h.short = short; h.color = d.color; h.days = [...d.days].sort(); sync(h.id); }
      const id = sheet.id;
      render();
      openSheet({ type: 'detail', id, month: todayStr().slice(0, 7) });
      toast('저장했어요');
    } else {
      createHabit(name, d.color, [...d.days].sort(), short);
      closeSheet(); render();
      toast(`‘${name}’ 습관을 만들었어요`);
    }
  }

  function renderDetail() {
    const h = habits.find(x => x.id === sheet.id);
    if (!h) { closeSheet(); return; }
    const today = todayStr();
    const cur = currentStreak(h), best = bestStreak(h), r = rateOver([h], addDays(today, -29), today);
    const [y, m] = sheet.month.split('-').map(Number);

      cells += `<button class="cell ${cls}" style="--rot:${rotFor(h.id + '|' + s)}" data-act="cal-toggle" data-date="${s}" ${s > today ? 'disabled' : ''} aria-pressed="${dn}" aria-label="${m}월 ${dd}일${dn ? ', 도장 찍음' : ''}">${dd}</button>`;
    }
    const monthDone = h.done.filter(s => s.startsWith(sheet.month)).length;

    $('sheet').innerHTML = `<div class="grip"></div>

        <div class="dstat"><span class="k">최근 30일 달성률</span><span class="v">${r === null ? '–' : r}<small>${r === null ? '' : '%'}</small></span></div>

        <button class="icon-btn" data-act="month" data-dir="1" aria-label="다음 달" ${sheet.month >= today.slice(0, 7) ? 'disabled' : ''}>${ICON_R}</button>

      <p class="hint">날짜를 눌러 지난 날 도장을 찍거나 지울 수 있어요.</p>
      ${monthlyRecordHTML(h)}
      ${sheet.confirm ? `<div class="confirm">
          <p><b>‘${esc(h.name)}’</b> 습관을 삭제할까요? 찍은 도장 ${fmt(h.done.length)}개도 함께 사라져요.</p>
          <div class="actions"><button class="btn" data-act="cancel-delete">취소</button><button class="btn danger" data-act="do-delete">삭제</button></div>
        </div>` : `<div class="actions">

        </div>`}`;
  }

  // Month-by-month record for one habit, newest first: stamped days / days it was due, and the rate.
  function monthStat(h, ym) {
    const today = todayStr();
    const [y, m] = ym.split('-').map(Number);
    const first = `${ym}-01`, last = `${ym}-${pad(new Date(y, m, 0).getDate())}`;
    const start = startOf(h);
    const from = first > start ? first : start, to = last < today ? last : today;
    let total = 0, hit = 0;
    for (let s = from; s <= to; s = addDays(s, 1)) {
      if (!scheduled(h, s)) continue;
      const d = isDone(h, s);
      if (s === today && !d) continue;
      total++; if (d) hit++;
    }
    return { total, hit, rate: total ? Math.round(hit / total * 100) : null };
  }
  function monthlyRecordHTML(h) {
    const today = todayStr(), thisMonth = today.slice(0, 7), thisYear = +today.slice(0, 4);
    const months = [];
    let ym = startOf(h).slice(0, 7);
    while (ym <= thisMonth && months.length < 600) {
      months.unshift(ym);
      const [y, m] = ym.split('-').map(Number);
      ym = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`;
    }
    const rows = months.map(ym => {
      const [y, m] = ym.split('-').map(Number);
      const st = monthStat(h, ym);
      const cls = st.rate === null ? 't-sub' : st.rate >= 80 ? 't-green' : st.rate < 50 ? 't-coral' : '';
      const label = `${y !== thisYear ? `<small>${y}년</small>` : ''}${m}월${ym === thisMonth ? '<small>진행 중</small>' : ''}`;
      return `<li><button class="mrow" data-act="goto-month" data-ym="${ym}" ${ym === sheet.month ? 'aria-current="true"' : ''}
          aria-label="${y}년 ${m}월, ${st.hit}/${st.total}일, ${st.rate === null ? '기록 없음' : st.rate + '%'}">
        <span class="mn">${label}</span>
        <span class="mt"><span style="width:${st.rate || 0}%"></span></span>
        <span class="mc">${st.hit}/${st.total}일</span>
        <span class="mp ${cls}">${st.rate === null ? '–' : st.rate + '%'}</span>
      </button></li>`;
    }).join('');
    return `<section class="mrec">
        <h3>월별 기록</h3>
        <p class="cs">도장 찍은 날 / 해야 했던 날. 누르면 위 달력이 그 달로 바뀌어요.</p>
        <ul class="mlist" style="--hc:${inkVar(h.color)}">${rows}</ul>
      </section>`;
  }

  /* ---------- Toast ---------- */
  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) { if (e.target === $('sheet-wrap')) closeSheet(); return; }
    if (el.disabled) return;
    const act = el.dataset.act;
    switch (act) {
      case 'tab': if (tab !== el.dataset.tab) { tab = el.dataset.tab; render(); window.scrollTo(0, 0); } break;
      case 'toggle': toggle(el.dataset.id, el.dataset.date); break;
      case 'pick-day': selDate = el.dataset.date; render(); break;
      case 'go-today': selDate = todayStr(); render(); break;
      case 'hist-day': histDate = el.dataset.date; render(); break;
      case 'hist-month': {
        const [y, m] = histMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + (+el.dataset.dir), 1);
        const nm = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        if (nm <= todayStr().slice(0, 7)) { histMonth = nm; render(); }
        break;
      }
      case 'open': openSheet({ type: 'detail', id: el.dataset.id, month: (tab === 'history' ? histMonth : todayStr().slice(0, 7)) }); break;
      case 'add': openSheet({ type: 'add', draft: { name: '', short: '', shortTouched: false, color: COLORS[habits.length % COLORS.length][0], days: [...ALL_DAYS] } }); break;
      case 'settings': openSheet({ type: 'settings' }); break;
      case 'close': closeSheet(); break;
      case 'suggest': {
        const p = presets[+el.dataset.i]; if (!p) break;
        if (habits.some(h => h.name === p.name)) { toast(`‘${p.name}’ 습관은 이미 있어요`); break; }
        createHabit(p.name, p.color, ALL_DAYS, p.short); render(); toast(`‘${p.name}’ 습관을 만들었어요`); break;
      }
      case 'add-all': {
        const used = new Set(habits.map(h => h.name));
        const todo = presets.filter(p => !used.has(p.name));
        todo.forEach(p => createHabit(p.name, p.color, ALL_DAYS, p.short));
        render(); toast(`습관 ${todo.length}개를 만들었어요`); break;
      }
      case 'presets': openSheet({ type: 'presets', editIdx: null }); break;
      case 'presets-from-add': openSheet({ type: 'presets', editIdx: null, back: sheet.draft }); break;
      case 'presets-back': openSheet({ type: 'add', draft: sheet.back }); break;
      case 'use-preset': {
        const p = presets[+el.dataset.i]; if (!p) break;
        Object.assign(sheet.draft, { name: p.name, short: p.short || autoShort(p.name), shortTouched: true, color: p.color, days: [...ALL_DAYS] });
        $('habit-name').value = p.name; $('form-err').textContent = '';
        refreshFormBits(); break;
      }
      case 'pick-color': sheet.draft.color = el.dataset.color; refreshFormBits(); break;
      case 'pick-day-of-week': {
        const w = +el.dataset.w, ds = sheet.draft.days;
        sheet.draft.days = ds.includes(w) ? ds.filter(x => x !== w) : [...ds, w];
        $('form-err').textContent = ''; refreshFormBits(); break;
      }
      case 'preset': {
        const p = el.dataset.p;
        sheet.draft.days = p === 'all' ? [...ALL_DAYS] : p === 'wk' ? [1, 2, 3, 4, 5] : [0, 6];
        $('form-err').textContent = ''; refreshFormBits(); break;
      }
      case 'cal-toggle': toggle(sheet.id, el.dataset.date); break;
      case 'goto-month': {
        sheet.month = el.dataset.ym; renderDetail();
        const cal = $('sheet').querySelector('.cal');
        if (cal) cal.scrollIntoView({ block: 'center', behavior: 'smooth' });
        break;
      }
      case 'month': {
        const [y, m] = sheet.month.split('-').map(Number);
        const d = new Date(y, m - 1 + (+el.dataset.dir), 1);
        const nm = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        if (nm <= todayStr().slice(0, 7)) { sheet.month = nm; renderDetail(); }
        break;
      }
      case 'edit': {
        const h = habits.find(x => x.id === sheet.id);
        if (h) openSheet({ type: 'edit', id: h.id, draft: { name: h.name, short: sealText(h), shortTouched: true, color: h.color, days: [...h.days] } });
        break;
      }
      case 'ask-delete': sheet.confirm = true; renderDetail(); break;
      case 'cancel-delete': sheet.confirm = false; renderDetail(); break;
      case 'do-delete': {
        const id = sheet.id, h = habits.find(x => x.id === id);
        habits = habits.filter(x => x.id !== id);
        sync(id); closeSheet(); render();
        if (h) toast(`‘${h.name}’ 습관을 삭제했어요`);
        break;
      }
      case 'preset-color': {
        const p = presets[+el.dataset.i]; if (!p) break;
        const inp = $('preset-edit-input'); if (inp) sheet.editText = inp.value;
        const inS = $('preset-edit-short'); if (inS) sheet.editShort = inS.value;
        const nn = $('preset-new'), ns = $('preset-new-short');
        const keepNew = nn ? [nn.value, ns.value] : null;
        const k = COLORS.findIndex(c => c[0] === p.color);
        p.color = COLORS[(k + 1) % COLORS.length][0];
        savePresets();
        if (keepNew) { $('preset-new').value = keepNew[0]; $('preset-new-short').value = keepNew[1]; }
        break;
      }
      case 'preset-edit': sheet.editIdx = +el.dataset.i; sheet.editText = null; sheet.editShort = null; renderPresets(); break;
      case 'preset-cancel': sheet.editIdx = null; sheet.editText = null; sheet.editShort = null; renderPresets(); break;
      case 'preset-del': {
        const [p] = presets.splice(+el.dataset.i, 1);
        sheet.editIdx = null; sheet.editText = null; sheet.editShort = null;
        if (p) savePresets(`‘${p.name}’을(를) 목록에서 뺐어요`);
        break;
      }
      case 'clear-ask': sheet.confirmClear = true; renderSettings(); break;
      case 'clear-cancel': sheet.confirmClear = false; renderSettings(); break;
      case 'clear-do': {
        // Keep every habit (name, 압축명, color, days); drop all stamps and restart each habit from today
        const today = todayStr();
        let n = 0;
        for (const h of habits) {
          if (!h.done.length && h.createdAt === today) continue;
          n += h.done.length;
          h.done = [];
          h.createdAt = today;
          sync(h.id);
        }
        sheet.confirmClear = false;
        selDate = today; histDate = today; histMonth = today.slice(0, 7);
        render();
        toast(`도장 기록 ${fmt(n)}개를 지웠어요. 오늘부터 새로 시작해요`);
        break;
      }
      case 'install': {
        const p = installPrompt; if (!p) break;
        p.prompt();
        p.userChoice.then(c => { if (c && c.outcome === 'accepted') installPrompt = null; render(); }).catch(() => { });
        break;
      }
      case 'notice-hide': lsSet(LS_NOTICE + el.dataset.kind, todayStr()); render(); break;
      case 'backup-save': saveBackupFile(); break;
      case 'backup-share': shareBackupFile(); break;
      case 'restore-pick': { const f = $('restore-file'); f.value = ''; f.click(); break; }
      case 'restore-cancel': sheet.restore = null; renderSettings(); break;
      case 'restore-do': {
        const r = sheet.restore; if (!r) break;
        habits = sortH(r.habits);
        if (r.presets) presets = r.presets;
        saveCache();
        sheet.restore = null;
        const t = todayStr(); selDate = t; histDate = t; histMonth = t.slice(0, 7);
        render();
        toast(`백업을 불러왔어요 · 습관 ${habits.length}개`);
        break;
      }
      case 'preset-reset': sheet.confirmReset = true; renderPresets(); break;
      case 'preset-reset-cancel': sheet.confirmReset = false; renderPresets(); break;
      case 'preset-reset-do':
        presets = clone(DEFAULT_PRESETS); sheet.confirmReset = false; sheet.editIdx = null;
        savePresets('기본 목록으로 되돌렸어요'); break;
    }
  });
  document.addEventListener('input', e => {
    if ((e.target.id === 'preset-new' || e.target.id === 'preset-edit-input') && $('preset-err')) $('preset-err').textContent = '';
    if (e.target.id === 'habit-name' && sheet && sheet.draft) {
      const d = sheet.draft;
      d.name = e.target.value;
      if (!d.shortTouched) d.short = d.name.trim() ? cleanShort(autoShort(d.name)) : '';
      $('form-err').textContent = ''; refreshFormBits();
    }
    if (e.target.id === 'habit-short' && sheet && sheet.draft) {
      const d = sheet.draft;
      d.short = cleanShort(e.target.value);
      d.shortTouched = d.short !== '';
      $('form-err').textContent = ''; refreshFormBits();
    }
    if (e.target.id === 'preset-new' && sheet && !sheet.newShortTouched) {
      const s = $('preset-new-short'); if (s) s.value = e.target.value.trim() ? cleanShort(autoShort(e.target.value)) : '';
    }
    if (e.target.id === 'preset-new-short' && sheet) sheet.newShortTouched = e.target.value.trim() !== '';
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'habit-form') { e.preventDefault(); submitForm(); return; }
    const f = e.target.dataset && e.target.dataset.form;
    if (!f || !sheet) return;
    e.preventDefault();
    const err = msg => { $('preset-err').textContent = msg; };
    if (f === 'preset-add') {
      const name = $('preset-new').value.trim();
      if (!name) { err('추가할 이름을 입력해 주세요.'); $('preset-new').focus(); return; }
      if (presets.some(p => p.name === name)) { err('이미 목록에 있는 이름이에요.'); return; }
      const short = cleanShort($('preset-new-short').value) || autoShort(name);
      presets.push({ name: name.slice(0, 24), color: COLORS[presets.length % COLORS.length][0], short });
      sheet.newShortTouched = false;
      savePresets(`‘${name}’(${short})을(를) 목록에 추가했어요`);
      setTimeout(() => { const i = $('preset-new'); if (i) i.focus(); }, 30);
    } else if (f === 'preset-edit') {
      const i = +e.target.dataset.i, name = $('preset-edit-input').value.trim();
      const short = cleanShort($('preset-edit-short').value);
      if (!name) { err('이름을 비워 둘 수 없어요.'); return; }
      if (!short) { err('압축표현을 1~3글자로 정해 주세요.'); $('preset-edit-short').focus(); return; }
      if (presets.some((p, j) => j !== i && p.name === name)) { err('이미 목록에 있는 이름이에요.'); return; }
      presets[i].name = name.slice(0, 24);
      presets[i].short = short;
      sheet.editIdx = null; sheet.editText = null; sheet.editShort = null;
      savePresets('수정했어요');
    }
  });
  $('restore-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const r = readBackup(String(rd.result || ''));
      if (!r) { toast('Grit 백업 파일이 아니에요. ‘grit-backup-날짜.json’ 파일을 골라 주세요.'); return; }
      if (!sheet || sheet.type !== 'settings') openSheet({ type: 'settings' });
      sheet.restore = r; renderSettings();
    };
    rd.onerror = () => toast('파일을 읽지 못했어요. 다시 골라 주세요.');
    rd.readAsText(f);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = todayStr();
    if (t !== lastToday) {
      if (selDate === lastToday) selDate = t;
      if (histDate === lastToday) histDate = t;
      if (histMonth === lastToday.slice(0, 7)) histMonth = t.slice(0, 7);
      lastToday = t; render();
    }
  });

  /* ---------- Install as an app, offline support ---------- */
  let installPrompt = null;
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; render(); toast('홈 화면에 설치했어요'); });
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true; location.reload();   // a new version was published to GitHub
    });
  }

  render();
})();
</script>
</body>
</html>
